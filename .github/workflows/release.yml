name: Release package

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - name: Checkout widgets
        uses: actions/checkout@v7

      - name: Checkout EasyBar
        uses: actions/checkout@v7
        with:
          repository: easybar-app/easybar
          path: easybar-source

      - name: Install Lua
        run: easybar-source/scripts/ci/install-dependencies.sh lua

      - name: Validate packages and run tests
        run: make check EASYBAR_ROOT=easybar-source

      - name: Resolve package tag
        id: package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          package="${RELEASE_TAG%-v*}"
          version="${RELEASE_TAG##*-v}"
          if [[ -z "$package" || -z "$version" || "$package" == "$RELEASE_TAG" ]]; then
            echo "Invalid package tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "name=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build deterministic archive
        id: archive
        run: |
          scripts/support/python.sh scripts/release/package.py \
            --package "${{ steps.package.outputs.name }}" \
            --version "${{ steps.package.outputs.version }}" \
            --output-dir dist >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.archive.outputs.archive }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Write registry metadata summary
        env:
          PACKAGE: ${{ steps.package.outputs.name }}
          VERSION: ${{ steps.package.outputs.version }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          {
            echo '### Registry version metadata'
            echo
            echo '```toml'
            echo '[[versions]]'
            echo "version = \"$VERSION\""
            echo "archive = \"https://github.com/easybar-app/widgets/releases/download/$PACKAGE-v$VERSION/$PACKAGE-$VERSION.tar.gz\""
            echo "sha256 = \"$SHA256\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
