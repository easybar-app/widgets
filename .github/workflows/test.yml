name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - name: Checkout widgets
        uses: actions/checkout@v7

      - name: Checkout EasyBarKit
        uses: actions/checkout@v7
        with:
          repository: easybar-app/easybar-kit
          path: easybar-kit-source

      - name: Install development dependencies
        run: easybar-kit-source/scripts/ci/install-dependencies.sh format

      - name: Validate packages and run tests
        run: make check EASYBAR_KIT_ROOT=easybar-kit-source
