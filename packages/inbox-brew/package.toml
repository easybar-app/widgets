manifest_version = 2
name = "inbox-brew"
version = "0.5.0"
kind = "widget"
description = "Homebrew updates and actions in EasyBar's native inbox."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.1.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "inbox", "system"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-brew"

[dependencies]
brew-policy = "^0.1.0"
shared = "^0.1.0"

[requirements]
commands = ["brew"]
native_inbox = true

[[settings]]
namespace = "brew-inbox"
key = "automatic_updates"
type = "boolean"
default = true
description = "Automatically upgrade eligible outdated packages after refreshing Homebrew metadata."

[[settings]]
namespace = "brew-inbox"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 10080
default = 30
description = "Minutes between automatic Homebrew update checks."

[[settings]]
namespace = "brew-inbox"
key = "source_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 30
description = "Order of the Homebrew group when the inbox is grouped by source."

[[settings]]
namespace = "brew-inbox"
key = "context_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 30
description = "Order of Homebrew in the inbox source context menu."
