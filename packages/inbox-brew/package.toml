manifest_version = 1
name = "inbox-brew"
version = "0.1.0"
kind = "widget"
description = "Homebrew updates and actions in EasyBar's native inbox."
license = "Apache-2.0"
minimum_easybar_version = "0.41.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "inbox", "system"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-brew"

[dependencies]
brew = "^0.1.0"
shared = "^0.1.0"

[requirements]
commands = ["brew"]
native_inbox = true
