manifest_version = 2
name = "brew"
version = "0.3.0"
kind = "widget"
description = "Homebrew updates and upgrades in a standalone popup."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.1.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "system"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/brew"

[dependencies]
brew-policy = "^0.1.0"
shared = "^0.1.0"

[requirements]
commands = ["brew"]

[[settings]]
namespace = "brew"
key = "automatic_updates"
type = "boolean"
default = true
description = "Automatically update Homebrew metadata and upgrade eligible outdated packages."
