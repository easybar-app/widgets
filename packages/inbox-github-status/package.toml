manifest_version = 2
name = "inbox-github-status"
version = "0.1.1"
kind = "widget"
description = "Active GitHub service incidents in EasyBar's native inbox."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.3.2"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "inbox", "system"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-github-status"

[dependencies]
shared = "^0.2.1"

[requirements]
commands = ["curl"]
native_inbox = true

[[settings]]
namespace = "github-status-inbox"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 10080
default = 5
description = "Minutes between GitHub incident checks."

[[settings]]
namespace = "github-status-inbox"
key = "source_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 15
description = "Order of GitHub Status when the inbox is grouped by source."

[[settings]]
namespace = "github-status-inbox"
key = "context_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 15
description = "Order of GitHub Status in the inbox source context menu."
