manifest_version = 2
name = "nvim-mason"
version = "0.2.1"
kind = "widget"
description = "Available mason.nvim tool updates in a standalone status item."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.1.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "system"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/nvim-mason"

[dependencies]
shared = "^0.2.1"

[requirements]
commands = ["nvim"]
optional_environment = ["NVIM"]

[[settings]]
namespace = "nvim-mason"
key = "automatic_updates"
type = "boolean"
default = true
description = "Automatically install available mason.nvim tool updates after scheduled checks."

[[settings]]
namespace = "nvim-mason"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 1440
default = 60
description = "Minutes between automatic mason.nvim update checks."
