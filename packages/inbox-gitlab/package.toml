manifest_version = 2
name = "inbox-gitlab"
version = "0.4.6"
kind = "widget"
description = "GitLab work items and merge-request actions in EasyBar's native inbox."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.1.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "inbox", "notifications"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-gitlab"

[dependencies]
shared = "^0.2.1"

[requirements]
commands = ["glab"]
optional_environment = ["GITLAB_HOST"]
native_inbox = true

[[settings]]
namespace = "gitlab-inbox"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 10080
default = 5
description = "Minutes between automatic GitLab work-item checks."

[[settings]]
namespace = "gitlab-inbox"
key = "source_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 20
description = "Order of the GitLab group when the inbox is grouped by source."

[[settings]]
namespace = "gitlab-inbox"
key = "context_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 20
description = "Order of GitLab in the inbox source context menu."

[[settings]]
namespace = "gitlab-inbox"
key = "merge_method"
type = "string"
allowed = ["merge", "squash", "rebase"]
default = "merge"

[[settings]]
namespace = "gitlab-inbox"
key = "confirm_merge"
type = "boolean"
default = false
