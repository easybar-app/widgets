manifest_version = 2
name = "inbox-nvim-mason"
version = "0.1.0"
kind = "widget"
description = "mason.nvim tool updates and actions in EasyBar's native inbox."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.1.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "inbox", "system"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-nvim-mason"

[dependencies]
shared = "^0.1.0"

[requirements]
commands = ["nvim"]
optional_environment = ["NVIM"]
native_inbox = true

[[settings]]
namespace = "nvim-mason-inbox"
key = "automatic_updates"
type = "boolean"
default = true
description = "Automatically install available mason.nvim tool updates after scheduled checks."

[[settings]]
namespace = "nvim-mason-inbox"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 10080
default = 60
description = "Minutes between automatic mason.nvim update checks."

[[settings]]
namespace = "nvim-mason-inbox"
key = "source_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 36
description = "Order of the mason.nvim group when the inbox is grouped by source."

[[settings]]
namespace = "nvim-mason-inbox"
key = "context_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 36
description = "Order of mason.nvim in the inbox source context menu."
