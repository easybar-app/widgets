manifest_version = 2
name = "gitlab"
version = "0.1.1"
kind = "widget"
description = "Assigned GitLab issues and merge requests in a standalone popup."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.54.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "notifications"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/gitlab"

[dependencies]
shared = "^0.1.0"

[requirements]
commands = ["glab"]
optional_environment = ["GITLAB_HOST"]
