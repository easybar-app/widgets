manifest_version = 2
name = "inbox-widgets"
version = "0.7.8"
kind = "widget"
description = "Widget package updates in the native inbox."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.3.2"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["inbox", "system", "utilities"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-widgets"

[dependencies]
shared = "^0.1.4"

[requirements]
commands = ["curl"]
native_inbox = true

[[settings]]
namespace = "inbox-widgets"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 10080
default = 360
description = "Minutes between automatic widget update checks."

[[settings]]
namespace = "inbox-widgets"
key = "source_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 40
description = "Order of the Widgets group when the inbox is grouped by source."

[[settings]]
namespace = "inbox-widgets"
key = "context_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 40
description = "Order of Widgets in the inbox source context menu."
