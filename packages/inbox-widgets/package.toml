manifest_version = 1
name = "inbox-widgets"
version = "0.5.0"
kind = "widget"
description = "EasyBar package updates in the native inbox."
license = "Apache-2.0"
minimum_easybar_version = "0.44.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["inbox", "system", "utilities"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-widgets"

[dependencies]
shared = "^0.1.0"

[requirements]
commands = ["curl", "easybar"]
native_inbox = true

[[settings]]
namespace = "inbox-widgets"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 10080
default = 360
description = "Minutes between automatic widget update checks."
