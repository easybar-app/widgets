manifest_version = 2
name = "tailscale"
version = "0.1.2"
kind = "widget"
description = "Tailscale status, connection controls, and exit-node selection."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.54.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["network", "system"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/tailscale"

[dependencies]
shared = "^0.1.0"

[requirements]
commands = ["tailscale"]
optional_environment = ["TAILSCALE"]
