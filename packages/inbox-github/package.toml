manifest_version = 2
name = "inbox-github"
version = "0.5.3"
kind = "widget"
description = "GitHub notifications and pull-request actions in EasyBar's native inbox."
license = "Apache-2.0"
minimum_easybar_kit_version = "0.54.0"
entrypoint = "widget.lua"
readme = "README.md"
categories = ["developer-tools", "inbox", "notifications"]

[repository]
url = "https://github.com/easybar-app/widgets"
path = "packages/inbox-github"

[dependencies]
shared = "^0.1.0"

[requirements]
commands = ["gh"]
native_inbox = true

[[settings]]
namespace = "github-inbox"
key = "refresh_interval_minutes"
type = "integer"
minimum = 5
maximum = 10080
default = 5
description = "Minutes between automatic GitHub notification checks."

[[settings]]
namespace = "github-inbox"
key = "source_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 10
description = "Order of the GitHub group when the inbox is grouped by source."

[[settings]]
namespace = "github-inbox"
key = "context_order"
type = "integer"
minimum = -10000
maximum = 10000
default = 10
description = "Order of GitHub in the inbox source context menu."

[[settings]]
namespace = "github-inbox"
key = "merge_method"
type = "string"
allowed = ["merge", "squash", "rebase"]
default = "squash"

[[settings]]
namespace = "github-inbox"
key = "confirm_merge"
type = "boolean"
default = false
